name: Clean Clash Config

on:
  push:
    paths:
      - 'clash-0001.yaml'
      - 'clash-*.yaml'
  pull_request:
    paths:
      - 'clash-0001.yaml'
      - 'clash-*.yaml'
  schedule:   
    - cron: '10 * * * *'   #国际标准时间，北京时间+8，即下午1点钟
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Clash config file to clean'
        required: true
        default: 'clash-0001.yaml'

permissions:
  contents: write

jobs:
  clean-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false

      - name: Download clash config
        run: |
          CONFIG_FILE="${{ github.event.inputs.config_file || 'clash-0001.yaml' }}"
          DOWNLOAD_URL="https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/protocol/hysteria2/${CONFIG_FILE}"
          echo "Downloading from: $DOWNLOAD_URL"
          curl -fL "$DOWNLOAD_URL" -o "$CONFIG_FILE"
          if [ ! -s "$CONFIG_FILE" ]; then
            echo "Failed to download or empty file: $CONFIG_FILE"
            exit 1
          fi
          echo "Downloaded $(wc -l < "$CONFIG_FILE") lines"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Clean Clash config
        id: clean
        run: |
          CONFIG_FILE="${{ github.event.inputs.config_file || 'clash-0001.yaml' }}"
          python clean_clash_config.py "$CONFIG_FILE" "${CONFIG_FILE%.yaml}.clean.yaml"

      - name: Show diff
        run: |
          CONFIG_FILE="${{ github.event.inputs.config_file || 'clash-0001.yaml' }}"
          CLEAN_FILE="${CONFIG_FILE%.yaml}.clean.yaml"
          if [ -f "$CLEAN_FILE" ]; then
            echo "=== Diff ==="
            diff -u "$CONFIG_FILE" "$CLEAN_FILE" || true
          fi

      - name: Commit cleaned config
        if: github.event_name != 'pull_request'
        run: |
          CONFIG_FILE="${{ github.event.inputs.config_file || 'clash-0001.yaml' }}"
          CLEAN_FILE="${CONFIG_FILE%.yaml}.clean.yaml"
          if [ ! -f "$CLEAN_FILE" ]; then
            echo "Error: Cleaned config file not generated"
            exit 1
          fi
          
          if cmp -s "$CONFIG_FILE" "$CLEAN_FILE"; then
            echo "✓ No changes needed"
            exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv "$CLEAN_FILE" "$CONFIG_FILE"
          git add "$CONFIG_FILE"
          git commit -m "chore: clean control characters from $CONFIG_FILE"
          git push

      - name: Upload cleaned config as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-clash-config
          path: "*.clean.yaml"
          retention-days: 7
